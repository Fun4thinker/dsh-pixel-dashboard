<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!--
    dsh-pixel-dashboard 插件图标：柱状图 + 坐标轴基线，单一蓝色。

    为什么是"柱 + 轴"而不是"三根递增柱"：上一版只画三根等宽递增的柱，
    读起来就是手机信号格，跟"用量看板"没有关系。信号格没有轴，图表有轴，
    所以这里显式画一条基线，并让柱坐在基线上；柱宽也更宽、间距更紧，
    避开信号格那种细长等距的节奏。

    为什么只有一个颜色：上一版把最高的柱换成金色，想表达"峰顶是要花钱的
    地方"。但那一格金色没有任何独立含义，看起来只是随手换了颜色。
    颜色要么承担语义、要么不用。这里全部走插件的蓝（深浅两套都站得住），
    "花了多少钱"交给标题文字说，不由图标硬塞。

    对比度（Edge 无头渲染实测）：蓝 #3d7fb8 对白底 4.26:1、对深底 3.87:1，
    均过图形元素 3:1 的门槛。
  -->
  <g fill="#3d7fb8">
    <rect x="8.2" y="17.9" width="5.8" height="6.6" rx="1.2"/>
    <rect x="15.4" y="13.9" width="5.8" height="10.6" rx="1.2"/>
    <rect x="22.6" y="9.9" width="5.8" height="14.6" rx="1.2"/>
  </g>
  <line x1="6.2" y1="25.4" x2="29.8" y2="25.4" stroke="#3d7fb8"
        stroke-width="1.8" stroke-linecap="round"/>
</svg>
