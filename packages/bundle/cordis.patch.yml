# dsh-pixel-dashboard 的组合包 patch。
#
# 这一层只做一件事：把插件作为一行配置插进 profile 的条目树。
# 行的 name 用**包名**而不是路径，因此由 profile 的 node_modules 解析——
# 换机、升级、pnpm 重新布局都不影响它，这也是官方组合包的做法。
#
# 卸载：dsh plugin --profile <profile> remove dsh-pixel-dashboard-bundle
# 临时停用：给下面这行加 disabled: true

- insert:
    - id: pixel-dashboard
      name: 'dsh-pixel-dashboard'
